name: Main branch CI

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A *running* main run (which may be deploying) is never cancelled; a
  # *pending* one is still replaced by a newer push.
  cancel-in-progress: false

jobs:
  checks:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/checks.yml # zizmor: ignore[self-repository]

  # Example deploy job, run once every check passed. The real security boundary
